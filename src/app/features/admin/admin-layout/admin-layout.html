<div class="admin-shell">

  <!-- SIDEBAR -->

  <aside
    class="admin-sidebar"
    [class.mobile-open]="menuAbierto"
  >

    <!-- LOGO -->

    <div class="admin-brand">

      <a
        routerLink="/admin/dashboard"
        (click)="cerrarMenu()"
      >

        <strong>
          TIENDA SEBAS
        </strong>

        <span>
          ADMINISTRACIÓN
        </span>

      </a>

    </div>


    <!-- NAVEGACIÓN -->

    <nav class="admin-navigation">

      <p class="navigation-title">
        GENERAL
      </p>


      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          ◫
        </span>

        Dashboard
      </a>


      <p class="navigation-title">
        CATÁLOGO
      </p>


      <a
        routerLink="/admin/productos"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          □
        </span>

        Productos
      </a>


      <a
        routerLink="/admin/stock"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          ≡
        </span>

        Stock y tallas
      </a>


      <p class="navigation-title">
        NEGOCIO
      </p>


      <a
        routerLink="/admin/ventas"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          $
        </span>

        Ventas
      </a>


      <a
        routerLink="/admin/usuarios"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          ○
        </span>

        Usuarios
      </a>


      <a
        routerLink="/admin/reportes"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <span class="nav-icon">
          ↗
        </span>

        Reportes
      </a>

    </nav>


    <!-- PARTE INFERIOR -->

    <div class="sidebar-footer">

      <a
        routerLink="/"
        class="store-link"
      >
        ← Ver tienda
      </a>


      <button
        type="button"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>

    </div>

  </aside>


  <!-- CONTENIDO -->

  <div class="admin-main">

    <!-- TOPBAR -->

    <header class="admin-topbar">

      <div class="topbar-left">

        <button
          type="button"
          class="mobile-menu-button"
          (click)="toggleMenu()"
          aria-label="Abrir menú"
        >
          ☰
        </button>


        <div>

          <p>
            PANEL ADMINISTRATIVO
          </p>

          <strong>
            TIENDA SEBAS
          </strong>

        </div>

      </div>


      <div class="admin-user">

        <div class="admin-user-text">

          <span>
            ADMINISTRADOR
          </span>

          <strong>
            {{
              authService.obtenerCorreo()
              || 'Administrador'
            }}
          </strong>

        </div>


        <div class="admin-avatar">
          A
        </div>

      </div>

    </header>


    <!-- PÁGINA -->

    <main class="admin-content">

      <router-outlet>
      </router-outlet>

    </main>

  </div>

</div>
