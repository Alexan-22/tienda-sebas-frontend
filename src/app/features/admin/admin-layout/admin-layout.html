<div class="admin-shell">

  <!-- =====================================================
       SIDEBAR
       ===================================================== -->
  <aside class="admin-sidebar" [class.mobile-open]="menuAbierto">

    <!-- LOGO Y MARCA -->
    <div class="admin-brand">
      <a routerLink="/admin/dashboard" (click)="cerrarMenu()">
        <div class="brand-icon-box">SC</div>
        <div>
          <strong>SEBAS COLLECTION</strong>
          <span>PANEL ADMINISTRATIVO</span>
        </div>
      </a>
    </div>

    <!-- ===================================================
         NAVEGACIÓN PRINCIPAL
         =================================================== -->
    <nav class="admin-navigation">

      <!-- GENERAL -->
      <span class="navigation-title">GENERAL</span>

      <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </span>
        Dashboard
      </a>

      <!-- CONTENIDO -->
      <span class="navigation-title">CONTENIDO</span>

      <a routerLink="/admin/home" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </span>
        Página Principal
      </a>

      <!-- CATÁLOGO -->
      <span class="navigation-title">CATÁLOGO</span>

      <a routerLink="/admin/productos" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        </span>
        Productos
      </a>

      <a routerLink="/admin/stock" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </span>
        Stock y Tallas
      </a>

      <!-- NEGOCIO -->
      <span class="navigation-title">NEGOCIO</span>

      <a routerLink="/admin/vender" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </span>
        Vender (POS)
      </a>

      <a routerLink="/admin/ventas" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </span>
        Ventas y Pedidos
      </a>

      <a routerLink="/admin/usuarios" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </span>
        Usuarios
      </a>

      <a routerLink="/admin/reportes" routerLinkActive="active" (click)="cerrarMenu()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </span>
        Reportes
      </a>

    </nav>

    <!-- ===================================================
         FOOTER DE LA SIDEBAR
         =================================================== -->
    <div class="sidebar-footer">
      <a routerLink="/" class="store-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Ver Tienda Online
      </a>

      <button type="button" class="btn-logout" (click)="cerrarSesion()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Cerrar Sesión
      </button>
    </div>

  </aside>

  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->
  <div class="admin-main">

    <!-- ===================================================
         TOPBAR
         =================================================== -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-button"
          (click)="toggleMenu()"
          aria-label="Abrir menú">
          ☰
        </button>

        <div class="topbar-titles">
          <span>PANEL DE CONTROL</span>
          <strong>SEBAS COLLECTION</strong>
        </div>
      </div>

      <!-- USUARIO / PERFIL -->
      <div class="admin-user-profile">
        <div class="user-meta">
          <span class="user-role">ADMINISTRADOR</span>
          <strong>{{ authService.obtenerCorreo() || 'Administrador' }}</strong>
        </div>
        <div class="user-avatar-badge">A</div>
      </div>
    </header>

    <!-- ===================================================
         VISTAS DINÁMICAS (ROUTER OUTLET)
         =================================================== -->
    <main class="admin-content-area">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
