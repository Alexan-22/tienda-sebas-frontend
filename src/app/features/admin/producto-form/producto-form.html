<section class="page">

  <a
    routerLink="/admin/productos"
    class="back"
  >
    ← VOLVER A PRODUCTOS
  </a>

  <header>
    <p>CATÁLOGO</p>

    <h1>
      {{
        editando
          ? 'Editar producto'
          : 'Nuevo producto'
      }}
    </h1>
  </header>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  @if (cargando) {

    <div class="loading">
      Cargando producto...
    </div>

  } @else {

    <form (ngSubmit)="guardar()">

      <div class="main">

        <section class="card">

          <h2>Información</h2>

          <label>
            NOMBRE

            <input
              type="text"
              name="nombre"
              [(ngModel)]="nombre"
              required
            >
          </label>

          <label>
            DESCRIPCIÓN

            <textarea
              name="descripcion"
              [(ngModel)]="descripcion"
              rows="6"
            ></textarea>
          </label>

        </section>

        <section class="card">

          <h2>Precio</h2>

          <div class="columns">

            <label>
              PRECIO NORMAL

              <input
                type="number"
                name="precio"
                [(ngModel)]="precio"
                step="0.01"
                min="0"
              >
            </label>

            <label>
              PRECIO OFERTA

              <input
                type="number"
                name="precioOferta"
                [(ngModel)]="precioOferta"
                step="0.01"
                min="0"
              >
            </label>

          </div>

        </section>

        <section class="card">

          <h2>Clasificación</h2>

          <div class="columns">

            <label>
              GÉNERO

              <select
                name="genero"
                [(ngModel)]="idGenero"
              >

                <option [ngValue]="null">
                  Seleccionar
                </option>

                @for (
                  genero of generos;
                  track genero.idGenero
                ) {

                  <option
                    [ngValue]="genero.idGenero"
                  >
                    {{ genero.nombreGenero }}
                  </option>

                }

              </select>
            </label>

            <label>
              CATEGORÍA

              <select
                name="categoria"
                [(ngModel)]="idCategoria"
              >

                <option [ngValue]="null">
                  Seleccionar
                </option>

                @for (
                  categoria of categorias;
                  track categoria.idCategoria
                ) {

                  <option
                    [ngValue]="categoria.idCategoria"
                  >
                    {{
                      categoria.nombreCategoria
                    }}
                  </option>

                }

              </select>
            </label>

          </div>

        </section>

      </div>

      <aside>

        <section class="card">

          <h2>Imagen</h2>

          <label>
            NOMBRE DE ARCHIVO

            <input
              type="text"
              name="imagen"
              [(ngModel)]="imagen"
              placeholder="producto.jpg"
            >
          </label>

          <small>
            Después conectaremos aquí
            la subida de archivos.
          </small>

        </section>

        <section class="card">

          <h2>Visibilidad</h2>

          <label class="check">
            <span>Producto activo</span>

            <input
              type="checkbox"
              name="estado"
              [(ngModel)]="estado"
            >
          </label>

          <label class="check">
            <span>Nuevo</span>

            <input
              type="checkbox"
              name="nuevo"
              [(ngModel)]="nuevo"
            >
          </label>

          <label class="check">
            <span>Destacado</span>

            <input
              type="checkbox"
              name="destacado"
              [(ngModel)]="destacado"
            >
          </label>

        </section>

        <button
          class="save"
          type="submit"
          [disabled]="guardando"
        >
          {{
            guardando
              ? 'GUARDANDO...'
              : (
                editando
                  ? 'GUARDAR CAMBIOS'
                  : 'CREAR PRODUCTO'
              )
          }}
        </button>

      </aside>

    </form>

  }

</section>
