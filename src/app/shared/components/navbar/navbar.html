<header class="site-header">

  <div class="navbar-container">

    <!-- LOGO -->
    <a
      routerLink="/"
      class="brand"
      (click)="cerrarMenu()"
    >
      <span class="brand-main">
        TIENDA SEBAS
      </span>

      <span class="brand-sub">
        POLVOS
      </span>
    </a>


    <!-- NAVEGACIÓN DESKTOP -->
    <nav class="desktop-nav">

      <a
        routerLink="/tienda"
        [queryParams]="{ nuevo: true }"
        class="nav-link"
      >
        Novedades
      </a>

      <a
        routerLink="/tienda"
        [queryParams]="{ genero: 1 }"
        class="nav-link"
      >
        Hombres
      </a>

      <a
        routerLink="/tienda"
        [queryParams]="{ genero: 2 }"
        class="nav-link"
      >
        Mujeres
      </a>

      <a
        routerLink="/tienda"
        [queryParams]="{ genero: 3 }"
        class="nav-link"
      >
        Niños
      </a>

      <a
        routerLink="/tienda"
        [queryParams]="{ genero: 4 }"
        class="nav-link"
      >
        Niñas
      </a>

      <a
        routerLink="/tienda"
        class="nav-link"
      >
        Colecciones
      </a>

    </nav>


    <!-- ACCIONES -->
    <div class="navbar-actions">

      <!-- CUENTA -->
      <button
        type="button"
        class="icon-button"
        aria-label="Mi cuenta"
        title="Mi cuenta"
        (click)="irACuenta()"
      >
        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
        </svg>
      </button>


      <!-- CARRITO -->
      <a
        routerLink="/carrito"
        class="icon-button cart-button"
        aria-label="Carrito"
        title="Carrito"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 2-1.6L21 7H7"></path>
          <circle cx="10" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
        </svg>

        @if (carritoService.cantidadTotal() > 0) {
          <span class="cart-count">
            {{ carritoService.cantidadTotal() }}
          </span>
        }
      </a>


      <!-- MENÚ MÓVIL -->
      <button
        type="button"
        class="icon-button menu-button"
        aria-label="Abrir menú"
        (click)="toggleMenu()"
      >
        @if (!menuAbierto) {
          <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        } @else {
          <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        }
      </button>

    </div>

  </div>


  <!-- MENÚ MÓVIL -->
  @if (menuAbierto) {

    <div class="mobile-menu">

      <nav class="mobile-nav">

        <a
          routerLink="/tienda"
          [queryParams]="{ nuevo: true }"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Novedades
        </a>

        <a
          routerLink="/tienda"
          [queryParams]="{ genero: 1 }"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Hombres
        </a>

        <a
          routerLink="/tienda"
          [queryParams]="{ genero: 2 }"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Mujeres
        </a>

        <a
          routerLink="/tienda"
          [queryParams]="{ genero: 3 }"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Niños
        </a>

        <a
          routerLink="/tienda"
          [queryParams]="{ genero: 4 }"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Niñas
        </a>

        <a
          routerLink="/tienda"
          class="mobile-link"
          (click)="cerrarMenu()"
        >
          Colecciones
        </a>


        <button
          type="button"
          class="mobile-link mobile-button"
          (click)="irACuenta()"
        >
          @if (authService.autenticado()) {
            Mis compras
          } @else {
            Iniciar sesión
          }
        </button>


        @if (authService.autenticado()) {

          <button
            type="button"
            class="mobile-link mobile-button logout-button"
            (click)="cerrarSesion()"
          >
            Cerrar sesión
          </button>

        }

      </nav>

    </div>

  }

</header>
